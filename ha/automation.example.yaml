# Home Assistant: receive the remote's TV actions on a webhook (copy into automations.yaml, then reload automations).
# Pick any long random webhook id and put the full URL in ~/.config/g20/g20.conf:
#   G20_HA_WEBHOOK_URL=http://<home-assistant>:8123/api/webhook/<webhook_id>
# Power toggles using a power-measuring plug on the TV: above 40 W the TV is considered on (many TV integrations report
# a stale state). Adapt the entity ids. Volume / mute use the TV integration's own commands.
- id: g20_remote_to_tv
  alias: G20 remote to TV
  mode: queued
  max: 10
  triggers:
  - trigger: webhook
    webhook_id: REPLACE_WITH_A_LONG_RANDOM_ID
    allowed_methods: [POST]
    local_only: true
  actions:
  - choose:
    - conditions: '{{ trigger.json.action == "power" }}'
      sequence:
      - choose:
        - conditions: '{{ states("sensor.tv_power_plug") | float(0) > 40 }}'
          sequence:
          - action: media_player.turn_off
            target: {entity_id: media_player.my_tv}
        default:
        - action: media_player.turn_on
          target: {entity_id: media_player.my_tv}
    - conditions: '{{ trigger.json.action == "volup" }}'
      sequence:
      - action: media_player.volume_up
        target: {entity_id: media_player.my_tv}
    - conditions: '{{ trigger.json.action == "voldown" }}'
      sequence:
      - action: media_player.volume_down
        target: {entity_id: media_player.my_tv}
    - conditions: '{{ trigger.json.action == "mute" }}'
      sequence:
      - action: media_player.volume_mute
        target: {entity_id: media_player.my_tv}
        data: {is_volume_muted: true}
    - conditions: '{{ trigger.json.action == "source" }}'
      sequence:
      - action: media_player.select_source
        target: {entity_id: media_player.my_tv}
        data: {source: '{{ trigger.json.source }}'}
    # Optional "smart" Source key (G20_SOURCE_VIA_HA=1): HA reports the TV's current input to the PC.
    # If the TV shows the PC the picker opens on screen; if the TV is on another input (you cannot see the PC) each press
    # selects the next HDMI input blindly. Needs the rest_command below, the PC's LAN address and G20_REMOTE_SECRET / G20_HA_IP
    # in ~/.config/g20/g20.conf (the PC then answers ONLY this one request from Home Assistant's IP).
    - conditions: '{{ trigger.json.action == "source_key" }}'
      sequence:
      - action: rest_command.g20_source_key
        data:
          cur: "{{ (state_attr('media_player.my_tv', 'source') or '') | string | lower }}"
        continue_on_error: true
#
# rest_commands.yaml (or configuration.yaml > rest_command:)
#   g20_source_key:
#     url: "http://PC_IP:48765/api/remote/source_key?cur={{ cur | urlencode }}&k=THE_SECRET_OF_G20_REMOTE_SECRET"
#     method: POST
#     timeout: 5

